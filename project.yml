name: Rat
options:
  bundleIdPrefix: com.lazarevzubov
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Rat:
    type: application
    platform: iOS
    sources:
      - path: Rat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazarevzubov.Rat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  RatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RatTests
    dependencies:
      - target: Rat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lazarevzubov.RatTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Rat:
    build:
      targets:
        Rat: all
        RatTests: [test]
    test:
      targets:
        - RatTests
    run:
      config: Debug
